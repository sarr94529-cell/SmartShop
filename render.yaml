services:
  - type: web
    name: smartshop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py produits_demo
    startCommand: gunicorn smartshop.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smartshop-db
          property: connectionString
      - key: SMARTCUSTOMER_API_URL
        value: https://smartcustomer-analytics.onrender.com/api/smartshop/evenements/
      - key: SMARTCUSTOMER_API_TOKEN
        sync: false

databases:
  - name: smartshop-db
    databaseName: smartshop
    user: smartshop
    plan: free
