{% extends 'base.html' %}{% block content %}<div class="container py-5"><h1 class="section-title mb-4">Notre catalogue</h1><form class="row g-2 mb-4" method="get"><div class="col-md-6"><input class="form-control" name="q" value="{{ q }}" placeholder="Rechercher un produit..."></div><div class="col-md-4"><select class="form-select" name="categorie"><option value="">Toutes les catégories</option>{% for valeur,libelle in categories %}<option value="{{ valeur }}" {% if categorie == valeur %}selected{% endif %}>{{ libelle }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary w-100">Rechercher</button></div></form><div class="row">{% for produit in produits %}{% include '_carte.html' %}{% empty %}<div class="alert alert-info">Aucun produit trouvé.</div>{% endfor %}</div></div>{% endblock %}
