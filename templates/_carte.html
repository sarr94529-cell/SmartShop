<div class="col-sm-6 col-lg-3 mb-4"><article class="card product-card h-100"><a href="{% url 'detail_produit' produit.pk %}" class="product-photo">{% if produit.image %}<img src="{{ produit.image.url }}" alt="{{ produit.nom }}">{% elif produit.image_demo_url %}<img src="{{ produit.image_demo_url }}" alt="Photo de démonstration : {{ produit.nom }}" loading="lazy">{% else %}<span>🛍️</span>{% endif %}</a><div class="card-body d-flex flex-column"><span class="badge text-bg-light align-self-start mb-2">{{ produit.get_categorie_display }}</span><h5 class="card-title">{{ produit.nom }}</h5><p class="price mt-auto">{{ produit.prix }} FCFA</p><div class="d-grid gap-2"><a href="{% url 'detail_produit' produit.pk %}" class="btn btn-outline-primary">Voir le produit</a>{% if produit.stock > 0 %}<form method="post" action="{% url 'ajouter_panier' produit.pk %}">{% csrf_token %}<button class="btn btn-warning w-100">🛒 Ajouter au panier</button></form>{% else %}<button class="btn btn-secondary" disabled>Rupture de stock</button>{% endif %}</div></div></article></div>
